<!doctype html>
<html><head><meta charset="utf-8">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* Sticker-story covers. Logos: drop PNGs in logos/<slug>.png; missing ones show a typed placeholder tile. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222}
.cover{width:1080px;height:1440px;position:relative;overflow:hidden;font-family:Fredoka,sans-serif}
.photo{position:absolute;inset:0;background-size:cover;background-position:var(--pos,center)}
.photo{background-image:var(--p);background-size:var(--zoom,cover)}

/* logo sticker column (left) */
.logos{position:absolute;left:36px;top:56px;display:flex;flex-direction:column;gap:24px;width:260px}
.tile{background:#fff;border-radius:22px;height:104px;display:flex;align-items:center;justify-content:center;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18);overflow:hidden}
.tile img{max-width:100%;max-height:100%;object-fit:contain}
.tile .ph{color:#111;text-align:center;line-height:1}
/* placeholder wordmark styles (used only until real logos arrive) */
.serif{font:500 34px "Cormorant Garamond";letter-spacing:1px}
.caps{font:600 21px Inter;letter-spacing:3px}
.bold{font:900 40px Archivo;letter-spacing:-1px}
.tile.dark{background:#111}.tile.dark .ph{color:#fff}

/* headline pills (top-right, over open sky/background) */
.head{position:absolute;right:36px;top:56px;display:flex;flex-direction:column;align-items:flex-end;gap:18px}
/* pill stack (bottom-right) */
.pills{position:absolute;right:36px;bottom:120px;display:flex;flex-direction:column;align-items:flex-end;gap:18px}
.pill{background:#fff;color:#111;border-radius:999px;padding:12px 30px 10px;font-weight:700;font-size:42px;line-height:1.05;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
.pill.price{font-size:112px;padding:14px 50px 10px;color:#ff2d6f;letter-spacing:1px}
.pill.pink{background:#ffe3ec}
.pill.small{font-size:34px}
</style></head>
<body>

<!-- MODERN CONTEMPORARY -->
<div class="cover" id="contemporary" style="--p:url(PHOTO_1);--zoom:118%;--pos:52% 62%">
  <div class="photo"></div>
  <div class="logos">
    <div class="tile"><img src="logos/anthropologie.png" onerror="this.outerHTML='<span class=&quot;ph caps&quot;>ANTHROPOLOGIE</span>'"></div>
    <div class="tile"><img src="logos/free-people.png" onerror="this.outerHTML='<span class=&quot;ph serif&quot;>Free People</span>'"></div>
    <div class="tile"><img src="logos/revolve.png" onerror="this.outerHTML='<span class=&quot;ph bold&quot;>REVOLVE</span>'"></div>
    <div class="tile dark"><img src="logos/aritzia.png" onerror="this.outerHTML='<span class=&quot;ph serif&quot;>ARITZIA</span>'"></div>
    <div class="tile"><img src="logos/skims.png" onerror="this.outerHTML='<span class=&quot;ph bold&quot;>SKIMS</span>'"></div>
    <div class="tile"><img src="logos/polo.png" onerror="this.outerHTML='<span class=&quot;ph serif&quot;>Polo Ralph Lauren</span>'"></div>
  </div>
  <div class="head">
    <div class="pill price">$1 STARTS</div>
    <div class="pill pink">10 SEC SUDDEN DEATH</div>
  </div>
  <div class="pills">
    <div class="pill">MODERN CONTEMPORARY</div>
    <div class="pill">KURATEDBYKENNY</div>
    <div class="pill small">LIVE [DAY] AT [TIME] EST</div>
  </div>
</div>

<!-- PREMIUM ACTIVEWEAR -->
<div class="cover" id="activewear" style="--p:url(PHOTO_2);--pos:center 30%">
  <div class="photo"></div>
  <div class="logos">
    <div class="tile"><img src="logos/alo.png" onerror="this.outerHTML='<span class=&quot;ph serif&quot;>alo</span>'"></div>
    <div class="tile"><img src="logos/lululemon.png" onerror="this.outerHTML='<span class=&quot;ph caps&quot;>LULULEMON</span>'"></div>
    <div class="tile"><img src="logos/fp-movement.png" onerror="this.outerHTML='<span class=&quot;ph caps&quot;>FP MOVEMENT</span>'"></div>
    <div class="tile dark"><img src="logos/nike.png" onerror="this.outerHTML='<span class=&quot;ph bold&quot;>NIKE</span>'"></div>
    <div class="tile"><img src="logos/white-fox.png" onerror="this.outerHTML='<span class=&quot;ph caps&quot;>WHITE FOX</span>'"></div>
    <div class="tile"><img src="logos/patagonia.png" onerror="this.outerHTML='<span class=&quot;ph bold&quot;>patagonia</span>'"></div>
  </div>
  <div class="head">
    <div class="pill price">$1 STARTS</div>
    <div class="pill pink">10 SEC SUDDEN DEATH</div>
  </div>
  <div class="pills">
    <div class="pill">PREMIUM ACTIVEWEAR</div>
    <div class="pill">KURATEDBYKENNY</div>
    <div class="pill small">LIVE [DAY] AT [TIME] EST</div>
  </div>
</div>

</body></html>
